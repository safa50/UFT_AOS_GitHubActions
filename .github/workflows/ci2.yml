name: CI - UFT - 2

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uft-aos-runner
  cancel-in-progress: false

env:
  PROPS_TXT: FT-test-props.txt
  RES_XML: FT-test-results.xml
  RESULTS_DIR: uft-results
  LAUNCHER_EXE: FTToolsLauncher.exe
  LAUNCHER_URL: https://github.com/MicroFocus/ADM-FT-ToolsLauncher/releases/download/v24.2.0/FTToolsLauncher_net48.exe

defaults:
  run:
    working-directory: .\

jobs:
  run-tests:
    name: Run UFT AOS Test
    runs-on: [self-hosted, ft-runner]
    timeout-minutes: 30

    steps:

    - name: Checkout current repo
      uses: actions/checkout@v7
      with:
        ref: ${{ github.ref_name }}
        clean: false
        persist-credentials: false

    - name: Prepare UFT results folder
      shell: powershell
      run: |
        $resultsPath = Join-Path $env:GITHUB_WORKSPACE $env:RESULTS_DIR

        if (Test-Path -LiteralPath $resultsPath) {
          Remove-Item -LiteralPath $resultsPath -Recurse -Force
        }

        New-Item -ItemType Directory -Path $resultsPath -Force | Out-Null

        Write-Host "Results directory:"
        Write-Host $resultsPath

    - name: Create properties file
      shell: powershell
      run: |
        $testPath = Join-Path $env:GITHUB_WORKSPACE "UFT_AOS_GitHubActions"
        $resultsPath = Join-Path $env:GITHUB_WORKSPACE $env:RESULTS_DIR
        $junitPath = Join-Path $resultsPath $env:RES_XML

        $escapedTestPath = $testPath.Replace('\', '\\')
        $escapedResultsPath = $resultsPath.Replace('\', '\\')
        $escapedJunitPath = $junitPath.Replace('\', '\\')

        $content = @"
        runType=FileSystem
        resultsFilename=$escapedJunitPath
        fsReportPath=$escapedResultsPath
        Test1=$escapedTestPath
        resultTestNameOnly=true
        resultUnifiedTestClassname=true
        "@

        $content | Out-File -FilePath $env:PROPS_TXT -Encoding utf8

    - name: Check properties file
      shell: powershell
      run: |
        if (Test-Path $env:PROPS_TXT) {
          Write-Host "Properties file created successfully!"
          Write-Host ""
          Get-Content $env:PROPS_TXT
        }
        else {
          Write-Error "Properties file was not created!"
          exit 1
        }

    - name: Download Functional Testing tool
      shell: powershell
      run: |
        if (Test-Path $env:LAUNCHER_EXE) {
          Write-Host "FTToolsLauncher.exe already exists"
        }
        else {
          Invoke-WebRequest `
            -Uri $env:LAUNCHER_URL `
            -OutFile $env:LAUNCHER_EXE
        }

    - name: Run Functional Testing tool
      id: run-tests
      shell: powershell
      run: |
        $process = Start-Process `
          -FilePath "$env:LAUNCHER_EXE" `
          -ArgumentList "-paramfile $env:PROPS_TXT" `
          -NoNewWindow `
          -PassThru

        $process | Wait-Process

        Write-Host "FTToolsLauncher finished with exit code $($process.ExitCode)"

        "X=$($process.ExitCode)" >> $env:GITHUB_OUTPUT

    - name: Inspect generated UFT reports
      if: always()
      shell: powershell
      run: |
        $resultsPath = Join-Path $env:GITHUB_WORKSPACE $env:RESULTS_DIR

        Write-Host "Generated result files:"
        Write-Host ""

        if (Test-Path $resultsPath) {
          Get-ChildItem $resultsPath -Recurse -File |
            Select-Object FullName, Length |
            Format-Table -AutoSize
        }
        else {
          Write-Warning "Results directory does not exist."
        }

    - name: Normalize JUnit classname
      if: always()
      shell: powershell
      run: |
        $file = Join-Path `
          (Join-Path $env:GITHUB_WORKSPACE $env:RESULTS_DIR) `
          $env:RES_XML

        if (Test-Path $file) {
          [xml]$xml = Get-Content $file -Raw

          $testCases = $xml.SelectNodes("//testcase")

          if ($testCases.Count -gt 0) {
            foreach ($tc in $testCases) {
              $tc.classname = "FT.AOS"
            }

            $xml.Save($file)

            Write-Host "Updated classname to FT.AOS"
          }
          else {
            Write-Warning "JUnit report contains no testcase elements."
          }
        }
        else {
          Write-Warning "JUnit file not found: $file"
        }

    - name: Summarize FT results
      if: always()
      shell: powershell
      run: |
        $root = Join-Path $env:GITHUB_WORKSPACE $env:RESULTS_DIR

        $xmlFiles = @(
          Get-ChildItem `
            $root `
            -Recurse `
            -Filter "run_results.xml" `
            -File `
            -ErrorAction SilentlyContinue
        )

        $total = 0
        $passedTests = 0
        $warningTests = 0
        $failedTests = 0
        $errorTests = 0

        "## FT Results" >> $env:GITHUB_STEP_SUMMARY
        "" >> $env:GITHUB_STEP_SUMMARY
        "| Test | Status | Passed Steps | Warning Steps | Failed Steps |" >> $env:GITHUB_STEP_SUMMARY
        "|---|---|---:|---:|---:|" >> $env:GITHUB_STEP_SUMMARY

        foreach ($file in $xmlFiles) {

          try {

            [xml]$xml = Get-Content $file.FullName -Raw

            $top = $xml.Results.ReportNode

            if (-not $top) {
              Write-Host "No ReportNode in $($file.FullName)"
              continue
            }

            $name = [string]$top.Data.Name
            $result = [string]$top.Data.Result

            if ([string]::IsNullOrWhiteSpace($name)) {
              $name = $file.Directory.Name
            }

            $pass = 0
            $warn = 0
            $fail = 0

            foreach ($node in $xml.SelectNodes("//ReportNode[not(ReportNode)]")) {

              $stepResult = [string]$node.Data.Result

              if ([string]::IsNullOrWhiteSpace($stepResult)) {
                continue
              }

              switch ($stepResult.ToLower()) {

                "failed" {
                  $fail++
                }

                "error" {
                  $fail++
                }

                "warning" {
                  $warn++
                }

                "passed" {
                  $pass++
                }

                "done" {
                  $pass++
                }
              }
            }

            switch ($result.ToLower()) {

              "failed" {
                $status = "Failed"
                $failedTests++
              }

              "error" {
                $status = "Error"
                $errorTests++
              }

              "warning" {
                $status = "Warning"
                $warningTests++
              }

              default {
                $status = "Passed"
                $passedTests++
              }
            }

            $safeName = $name.Replace("|", "\|")

            "| $safeName | $status | $pass | $warn | $fail |" >> $env:GITHUB_STEP_SUMMARY

            $total++
          }
          catch {
            Write-Warning "Unable to parse: $($file.FullName)"
            Write-Warning $_.Exception.Message
          }
        }

        "" >> $env:GITHUB_STEP_SUMMARY

        if ($total -eq 0) {
          "_No detailed UFT run_results.xml files were found._" >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
        }

        "**Total tests:** $total" >> $env:GITHUB_STEP_SUMMARY
        "" >> $env:GITHUB_STEP_SUMMARY
        "**Passed tests:** $passedTests" >> $env:GITHUB_STEP_SUMMARY
        "" >> $env:GITHUB_STEP_SUMMARY
        "**Warning tests:** $warningTests" >> $env:GITHUB_STEP_SUMMARY
        "" >> $env:GITHUB_STEP_SUMMARY
        "**Failed tests:** $failedTests" >> $env:GITHUB_STEP_SUMMARY

        if ($errorTests -gt 0) {
          "" >> $env:GITHUB_STEP_SUMMARY
          "**Error tests:** $errorTests" >> $env:GITHUB_STEP_SUMMARY
        }

    - name: Upload complete UFT results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: uft-results-AOS
        path: uft-results
        if-no-files-found: error
        retention-days: 30
      continue-on-error: true

    - name: Check execution status
      if: ${{ steps.run-tests.outputs.X != 0 }}
      uses: actions/github-script@v6
      with:
        script: |
          core.setFailed('The UFT execution failed with status ${{ steps.run-tests.outputs.X }}')
      continue-on-error: true
